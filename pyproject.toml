[project]
name = "thor-llm-bench"
version = "0.1.0"
description = "Latency and throughput measurement client for LLM serving stacks on Jetson AGX Thor"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
thor-bench = "thor_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thor_bench"]
