[project]
name = "thor-tokenomics"
version = "0.1.0"
description = "Token latency measurement against OpenAI-compatible LLM servers on Jetson AGX Thor"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
thor-tokenomics = "thor_tokenomics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thor_tokenomics"]
