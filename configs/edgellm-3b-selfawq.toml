# Edge-LLM serving the self-quantized Qwen2.5-3B int4_awq engine.
# Start the server with EDGELLM_IGNORE_EOS=1, forced length is process wide.

stack = "edgellm"
url = "http://127.0.0.1:8080"
model = "qwen2.5-3b-instruct-selfawq-engine"

max_tokens = 128
warmup = 3
requests = 10
timeout_s = 600.0
runs_dir = "runs"
