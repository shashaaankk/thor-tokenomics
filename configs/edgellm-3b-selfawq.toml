# Edge-LLM serving the self-quantized Qwen2.5-3B int4_awq engine.
# serve.sh reads stack and artifact from this same file:
#   ./serve.sh configs/edgellm-3b-selfawq.toml

stack = "edgellm"
url = "http://127.0.0.1:8080"
model = "qwen2.5-3b-instruct-selfawq-engine"
artifact = "~/thor-llm-throughput-check/models/qwen2.5-3b-instruct-selfawq-engine"

max_tokens = 128
warmup = 3
requests = 10
timeout_s = 600.0
runs_dir = "runs"
